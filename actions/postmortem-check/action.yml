name: 事後報告の未完了チェック
description: >
  ADR-0011: 事後報告が未完了の緊急リリースを確認する。

  通常prodリリースのブロックは release-precheck が行う。
  このactionは催促のための確認であり、未報告があっても失敗させない
  （催促ジョブ自体が赤くなると、本当の問題と区別できなくなる）。

inputs:
  service:
    required: true
  app:
    required: true
  releases-table:
    required: true
  tickets-table:
    required: true
  approval-audit-table:
    required: true

outputs:
  unreported:
    description: 未報告があるか（true / false）
    value: ${{ steps.check.outputs.unreported }}
  count:
    description: 未報告の件数
    value: ${{ steps.check.outputs.count }}

runs:
  using: composite
  steps:
    - name: boto3の用意
      shell: bash
      run: pip install --quiet --disable-pip-version-check boto3

    - name: 確認
      id: check
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        APP: ${{ inputs.app }}
        RELEASES_TABLE: ${{ inputs.releases-table }}
        TICKETS_TABLE: ${{ inputs.tickets-table }}
        APPROVAL_AUDIT_TABLE: ${{ inputs.approval-audit-table }}
      run: |
        set -uo pipefail

        out="${RUNNER_TEMP}/unreported.md"

        set +e
        python3 "${GITHUB_ACTION_PATH}/../../scripts/release_store.py" unreported \
          --service "${SERVICE}" \
          --app "${APP}" \
          --summary-out "${out}"
        status=$?
        set -e

        if [[ ${status} -eq 1 ]]; then
          count="$(grep -c '^| `' "${out}" 2>/dev/null || echo 0)"
          {
            echo "unreported=true"
            echo "count=${count}"
          } >> "${GITHUB_OUTPUT}"
          cat "${out}" >> "${GITHUB_STEP_SUMMARY}"
        elif [[ ${status} -eq 0 ]]; then
          {
            echo "unreported=false"
            echo "count=0"
          } >> "${GITHUB_OUTPUT}"
        else
          # 設定不備やAWSの問題。催促ジョブは失敗させないが警告を出す
          echo "::warning::未報告チェックの実行に失敗しました（終了コード ${status}）"
          {
            echo "unreported=false"
            echo "count=0"
          } >> "${GITHUB_OUTPUT}"
        fi
