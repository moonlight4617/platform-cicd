name: planに渡すdigestの決定
description: >
  CIのplanに渡す image_digest を決める。

  アプリ側のTerraformは stage / prod で image_digest を必須にしている
  （ADR-0005を変数のvalidationで強制している）。CIのplanはデプロイではないため
  digestを持たないが、何も渡さないとvalidationでplanが失敗する。

  また固定のダミー値を渡すと、デプロイ済みのdigestと食い違い、
  planに毎回タスク定義の差分が出てしまう。plan差分のレビュー価値が落ちる。

  そのため「その環境に現在デプロイされている成果物のdigest」を渡す。
  未デプロイの環境では最新の成果物のdigestを使う。

inputs:
  service:
    required: true
  app:
    required: true
  env:
    required: true
  releases-table:
    required: true
  tickets-table:
    required: true
  approval-audit-table:
    required: true

outputs:
  image-digest:
    description: planに渡すdigest。該当がなければ空
    value: ${{ steps.resolve.outputs.image-digest }}
  var-arg:
    description: "terraform planに渡す引数（-var=image_digest=... または空）"
    value: ${{ steps.resolve.outputs.var-arg }}

runs:
  using: composite
  steps:
    - name: boto3の用意
      shell: bash
      run: pip install --quiet --disable-pip-version-check boto3

    - name: 決定
      id: resolve
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        APP: ${{ inputs.app }}
        ENV_NAME: ${{ inputs.env }}
        RELEASES_TABLE: ${{ inputs.releases-table }}
        TICKETS_TABLE: ${{ inputs.tickets-table }}
        APPROVAL_AUDIT_TABLE: ${{ inputs.approval-audit-table }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/../../scripts/release_store.py" digest-for-plan \
          --service "${SERVICE}" \
          --app "${APP}" \
          --env "${ENV_NAME}" \
          --github-output "${GITHUB_OUTPUT}"
